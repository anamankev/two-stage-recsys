[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "two-stage-recsys"
version = "0.1.0"
description = "Two-stage movie recommender: two-tower retrieval served by hnsw-engine, LightGBM ranker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "hnsw-engine",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "torch>=2.4,<3",
    "lightgbm>=4.3,<5",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
bench = ["faiss-cpu>=1.8,<2", "matplotlib>=3.8,<4", "psutil>=5.9,<8"]
serve = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]
dev = ["pytest>=8,<10", "ruff>=0.16,<0.17", "mypy>=2.0,<3", "types-PyYAML>=6,<7"]

[tool.uv.sources]
hnsw-engine = { path = "../hnsw-engine", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recsys = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: tests that take more than a few seconds"]
filterwarnings = [
    # Third-party: FastAPI's test client imports starlette's, which deprecates httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "NPY", "PT", "PERF", "PIE", "RET"]
ignore = ["RET504"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pandas.*", "lightgbm.*", "faiss.*", "psutil.*", "uvicorn.*"]
ignore_missing_imports = true
