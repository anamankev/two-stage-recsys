# Milestone B9 (Tier 3): the ML-1M two-tower configuration (configs/two_tower.yaml) on
# MovieLens-10M, unchanged except that ML-10M has no user demographics (use_side_features false).
data:
  data_dir: data
  dataset: ml-10m
  min_positives: 3
model:
  embedding_dim: 64
  hidden_dim: 128
  history_length: 50
  use_side_features: false
  negatives: in_batch_logq
  n_uniform_negatives: 1024
  batch_size: 1024
  max_epochs: 40
  learning_rate: 0.001
  weight_decay: 0.0
  temperature: 0.05
  learn_temperature: true
  patience: 3
  eval_k: 100
  seed: 0
  num_threads: 4
  max_minutes: 20.0
evaluation:
  k_max: 200
  bootstrap_resamples: 1000
  seed: 0
