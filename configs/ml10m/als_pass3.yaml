# Milestone B9, ALS tuning pass 3 on MovieLens-10M. Pass 1 (regularization 10, 30, 100) selected
# 100, the edge of its grid; pass 2 (300, 1000) confirmed 100 as an interior optimum (validation
# NDCG@10 0.0581 against 0.0406 and 0.0268). This pass refines around it. Run with --skip-simple.
data:
  data_dir: data
  dataset: ml-10m
  min_positives: 3
evaluation:
  k_max: 50
  bootstrap_resamples: 1000
  seed: 0
als_grid:
  factors: [128]
  regularization: [60.0, 150.0]
  alpha: [1.0]
  iterations: 15
  seed: 0
