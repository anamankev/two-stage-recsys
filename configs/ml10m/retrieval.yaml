# Milestone B9 (Tier 3): candidate retrieval on MovieLens-10M with the ML-1M settings
# (configs/retrieval.yaml). The pure-Python engine is left out: it returns the same candidates
# as the compiled engine (shown on ML-1M) and adds nothing at this scale.
data:
  data_dir: data
  dataset: ml-10m
  min_positives: 3
two_tower_run: results/two_tower/ml10m
n_candidates: 200
recall_ks: [10, 50, 100, 200]
retrievers:
  exact: {}
  hnsw-engine-numba:
    M: 16
    ef_construction: 200
    ef_search: 200
    engine: numba
  faiss-hnsw:
    M: 16
    ef_construction: 200
    ef_search: 200
evaluation:
  k_max: 50
  bootstrap_resamples: 1000
  seed: 0
